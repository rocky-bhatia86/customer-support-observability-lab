[project]
name = "support-ai"
version = "0.1.0"
description = "A hands-on lab for AI observability: a multi-agent customer support system with dynamic routing, real failure modes, Langfuse tracing, and LLM-as-a-judge evaluation."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Rocky Bhatia" },
]
dependencies = [
    "openai>=1.40",
    "python-dotenv>=1.0",
    "flask>=3.0",
]

[project.urls]
Repository = "https://github.com/rocky-bhatia86/customer-support-observability-lab"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
